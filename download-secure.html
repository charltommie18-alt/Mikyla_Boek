<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mikyla secure download</title>
<style>
body{margin:0;background:#0a0e2a;color:#eef;font-family:system-ui,sans-serif;padding:24px;text-align:center}
.card{background:#ffffff14;border:2px solid #facc15;border-radius:16px;padding:20px;max-width:480px;margin:20px auto}
.btn{display:inline-block;margin:10px 0;padding:14px 18px;background:#facc15;color:#000;border-radius:12px;font-weight:800;text-decoration:none}
.small{color:#94a3b8;font-size:14px}
</style>
</head>
<body>
<div class="card">
  <h1>📥 Opening your book download…</h1>
  <p class="small">You will be taken to the secure download page.</p>
  <p id="status" class="small">Please wait…</p>
  <a class="btn" id="go" href="https://charltommie18-alt.github.io/Mikyla_Boek/">Continue to download</a>
  <p class="small" style="margin-top:16px">charltommie18@gmail.com · 066 286 0284</p>
</div>
<script>
(function(){
  const p=new URLSearchParams(location.search);
  const book=(p.get('book')||'en').toLowerCase();
  const trans=p.get('trans')||'';
  const email=p.get('email')||'';
  const url='https://charltommie18-alt.github.io/Mikyla_Boek/?book='+encodeURIComponent(book)
    +'&trans='+encodeURIComponent(trans)
    +(email?'&email='+encodeURIComponent(email):'')
    +'#download';
  document.getElementById('go').href=url;
  document.getElementById('status').textContent='Book: '+book+(trans?' · Ref: '+trans:'');
  // Auto redirect — main page has embedded PDF download
  setTimeout(function(){ location.replace(url); }, 600);
})();
</script>
</body>
</html>
